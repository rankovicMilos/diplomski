name: Feature and Bugfix Branch Build

on:
    push:
        branches:
            - "feature/*"
            - "feat/*"
            - "bugfix/*"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Clone repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
            
            - name: Terraform Init
              run: terraform -chdir=infrastructure/environment/poc init

            - name: Terraform Validate
              run: terraform -chdir=infrastructure/environment/poc validate

            - name: Terraform Plan
              run: terraform -chdir=infrastructure/environment/poc plan