industry: telecom

sources:
  # Covers the Q4-2025.pdf link from the analysis as well: the listing always
  # returns the latest quarterly overviews.
  - id: ratel-quarterly-overviews
    name: "Ratel – Quarterly market overviews"
    url: https://www.ratel.rs/en/quarterly-data-electronic-communications
    strategy: crawl
    schedule: quarterly
    params:
      steps:
        - link_selector: "a[href$='.pdf']"
          link_pattern: "/Q[1-4]-20\\d{2}\\.pdf$"
          latest: 4
    usages:
      - {section: market_analysis}
      - {section: price_analysis}

  - id: quarterly-market-overview-q4-2025
    name: "Ratel – Quarterly market overview Q4 2025"
    url: https://www.ratel.rs/storage/upload/2026/03/Q4-2025.pdf
    strategy: single_url
    usages:
      - {section: market_analysis}
      - {section: price_analysis}
  
  - id: quarterly-market-overview-q4-2024
    name: "Ratel – Quarterly market overview Q4 2024"
    url: https://www.ratel.rs/storage/upload/2025/03/Q4-2024.pdf
    strategy: single_url
    usages:
      - {section: market_analysis}
      - {section: price_analysis}