  - id: mre-necp-2030
    name: "Ministarstvo rudarstva i energetike – Integrisani NECP do 2030 (vizija 2050)"
    url: https://www.mre.gov.rs/tekst/sr/1115/-integrisani-nacionalni-energetski-i-klimatski-plan-republike-srbije-za-period-do-2030-sa-vizijom-do-2050-godine.php
    strategy: single_url
    params:
      # The page links 12 PDFs (modelling inputs, rulebooks, consultations);
      # only the consolidated plan in English is needed
      follow_doc_links:
        pattern: "INEKP_.*_ENG\\.pdf$"
        max: 1
