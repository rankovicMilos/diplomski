  # The databrowser link from the analysis is a JavaScript app; Eurostat's CSV export
  # returns the same dataset (Serbia and EU27, from 2014) as a plain file; only the rows
  # of the analysis period are stored (preset csv.period_column).
  # Codes: EI_GDP_* = energy intensity of GDP (PPS / chain-linked volumes),
  # KGOE_TEUR = kg of oil equivalent per thousand euro.
  - id: eurostat-energy-intensity
    name: "Eurostat – Energetski intenzitet (nrg_ind_ei), Srbija vs EU27"
    url: "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/nrg_ind_ei/A...RS+EU27_2020?format=SDMX-CSV&startPeriod=2014"
    preset: eurostat_csv
    usages:
      - {section: market_analysis}

  - id: energy-community-2030-targets
    name: "Energy Community Ministerial Council – Klimatsko-energetski ciljevi 2030"
