name: Build and Deploy React Application to S3

on:
    pull_request:
        types:
            - closed
        branches:
            - develop

jobs:
    build-and-deploy:
        name: Build and Deploy React Application to S3
        if: >
          github.event.pull_request.merged == true &&
          (
            startsWith(github.event.pull_request.head.ref, 'feature/') ||
            startsWith(github.event.pull_request.head.ref, 'feat/') ||
            startsWith(github.event.pull_request.head.ref, 'bugfix/')
          )

        runs-on: ubuntu-latest

        steps:
            - name: Clone repository
              uses: actions/checkout@v4

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build React application
              run: npm run build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Sync (Deploy) to S3
              run: aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }} --delete